# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# CLI variant — cross-platform binary (linux/darwin/windows × amd64/arm64),
# tar.gz/zip archives, no system packaging. Use this for a CLI tool users
# download and run. For a host-installed service with an RPM, use
# goreleaser-daemon.yaml instead.
#
# Native GitLab publish: force_token + gitlab_urls.use_package_registry +
# release.gitlab make goreleaser build, upload to the Generic Package Registry,
# and create the GitLab Release in one `goreleaser release --clean` — no manual
# curl upload or release-cli job. Requires a real GITLAB_TOKEN (see skill.md;
# CI_JOB_TOKEN cannot create Releases).
#
# Placeholders below are {{PROJECT_NAME}}-style (UPPERCASE) — replace those.
# Leave goreleaser's own {{ .Version }}-style Go templates untouched.
---
version: 2

project_name: {{PROJECT_NAME}}

force_token: gitlab

gitlab_urls:
  api: {{GITLAB_API_URL}}
  download: {{GITLAB_DOWNLOAD_URL}}
  use_package_registry: true

before:
  hooks:
    - go mod tidy

builds:
  - id: {{PROJECT_NAME}}
    main: ./cmd          # adjust to the package containing main() (e.g. ".")
    binary: {{PROJECT_NAME}}
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Produces e.g. {{PROJECT_NAME}}-v1.0.0-linux-amd64.tar.gz
    # .Version is the bare semver (no leading v); the literal v keeps the prefix.
    name_template: >-
      {{ .ProjectName }}-v
      {{- .Version }}-
      {{- .Os }}-
      {{- .Arch }}

checksum:
  name_template: checksums.sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  gitlab:
    owner: {{GITLAB_OWNER}}
    name: {{PROJECT_NAME}}
  header: |
    ## {{PROJECT_NAME}} {{ .Tag }}
  footer: >-

    ---

    Released by [GoReleaser](https://goreleaser.com).

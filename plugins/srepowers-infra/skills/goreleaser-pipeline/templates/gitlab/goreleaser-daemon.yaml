# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# DAEMON / SERVICE variant — linux-only, ships an RPM (nfpms) with a systemd
# unit. Use this for long-running services installed on a host. For a
# cross-platform CLI binary with no system packaging, use goreleaser-cli.yaml
# instead.
---
version: 2

force_token: gitlab

before:
  hooks:
  - go mod tidy

builds:
- id: {{PROJECT_NAME}}
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  goarch:
  - amd64
  - arm64

archives:
- formats: [tar.gz]
  name_template: >-
    {{ .ProjectName }}_
    {{- title .Os }}_
    {{- if eq .Arch "amd64" }}x86_64
    {{- else if eq .Arch "386" }}i386
    {{- else }}{{ .Arch }}{{ end }}
    {{- if .Arm }}v{{ .Arm }}{{ end }}
  format_overrides:
  - goos: windows
    formats: [zip]

sboms: []

changelog:
  sort: asc
  filters:
    exclude:
    - "^docs:"
    - "^test:"

nfpms:
- id: {{PROJECT_NAME}}
  package_name: {{PROJECT_NAME}}
  homepage: {{GITLAB_DOWNLOAD_URL}}/{{GITLAB_OWNER}}/{{PROJECT_NAME}}
  maintainer: {{MAINTAINER_NAME}} <{{MAINTAINER_EMAIL}}>
  license: Apache 2.0
  formats:
  - rpm
  - deb
  bindir: /usr/bin
  scripts:
    preinstall: packaging/preinstall.sh
    postremove: packaging/postremove.sh
  contents:
  - src: packaging/{{PROJECT_NAME}}.service
    dst: /usr/lib/systemd/system/{{PROJECT_NAME}}.service
  - dst: /etc/{{PROJECT_NAME}}
    type: dir
    file_info:
      mode: 0755
  - src: packaging/config.yaml
    dst: /etc/{{PROJECT_NAME}}/config.yaml
    type: config
    file_info:
      owner: {{PROJECT_NAME}}
      group: {{PROJECT_NAME}}
      mode: 0600

gitlab_urls:
  api: {{GITLAB_API_URL}}
  download: {{GITLAB_DOWNLOAD_URL}}
  use_package_registry: true

release:
  gitlab:
    owner: {{GITLAB_OWNER}}
    name: {{PROJECT_NAME}}
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# CLI variant — cross-platform binary (linux/darwin/windows × amd64/arm64),
# tar.gz/zip archives, no system packaging. Use this for a CLI tool users
# download and run. For a host-installed service with an RPM, use
# goreleaser-daemon.yaml instead.
#
# GitHub-native: with no `gitlab_urls`/`force_token`, goreleaser's `release:`
# block targets GitHub Releases by default, using GITHUB_TOKEN from the Actions
# job. `goreleaser release --clean` builds, generates the changelog, and
# publishes the Release in one step.
#
# Replace {{PROJECT_NAME}}/{{GH_OWNER}} (UPPERCASE) placeholders only — leave
# goreleaser's own {{ .Version }}-style Go templates untouched.
---
version: 2

project_name: {{PROJECT_NAME}}

before:
  hooks:
    - go mod tidy

builds:
  - id: {{PROJECT_NAME}}
    main: ./cmd          # adjust to the package containing main() (e.g. ".")
    binary: {{PROJECT_NAME}}
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Produces e.g. {{PROJECT_NAME}}-1.0.0-linux-amd64.tar.gz
    # (.Version is the bare semver, no leading v — prefix with a literal "v"
    # before {{ .Version }} if you want one.)
    name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}-
      {{- .Os }}-
      {{- .Arch }}

checksum:
  name_template: checksums.sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  replace_existing_draft: true
  header: |
    ## {{PROJECT_NAME}} {{ .Tag }}
  footer: |
    **Full changelog**: https://github.com/{{GH_OWNER}}/{{PROJECT_NAME}}/compare/{{ .PreviousTag }}...{{ .Tag }}

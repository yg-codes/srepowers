name: Release

# Tag-triggered GoReleaser release. Pushing a vX.Y.Z tag builds the artifacts
# and publishes a GitHub Release. GITHUB_TOKEN is injected automatically by
# Actions — no secret to create — but the job needs `contents: write` to create
# the Release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so goreleaser can build the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
